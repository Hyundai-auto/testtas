<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Seguro | Pagamento PIX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #0055ff;
            --primary-dark: #0033cc;
            --bg-light: #f5f7fa;
            --bg-white: #ffffff;
            --text-dark: #1a1a1a;
            --text-gray: #555;
            --border-color: #e0e4e8;
            --success: #28a745;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-light); color: var(--text-dark); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: var(--bg-white); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 20px; text-align: center; }
        .content { padding: 24px; }
        
        .order-summary { background: #f8fafc; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        .order-info h3 { font-size: 1rem; }
        .order-info p { color: var(--primary); font-weight: bold; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; color: var(--text-gray); }
        .form-group input { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 10px; outline: none; font-size: 1rem; }
        .form-group input:focus { border-color: var(--primary); }

        .btn-pay { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-pay:hover { background: var(--primary-dark); transform: translateY(-2px); }

        #pix-section { display: none; text-align: center; animation: fadeIn 0.5s; }
        .pix-box { background: #f0f7ff; border: 2px dashed var(--primary); border-radius: 15px; padding: 20px; margin-top: 10px; }
        .qr-code-img { width: 200px; height: 200px; margin: 10px auto; background: white; padding: 10px; border-radius: 10px; }
        .pix-code { font-family: monospace; font-size: 0.75rem; word-break: break-all; background: white; padding: 10px; border-radius: 8px; margin: 15px 0; border: 1px solid #ddd; max-height: 80px; overflow-y: auto; }
        .btn-copy { background: #FFC107; color: #000; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; }
        
        .loading { display: none; flex-direction: column; align-items: center; gap: 10px; margin: 20px 0; }
        .spinner { width: 30px; height: 30px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Checkout Seguro</h2>
        </div>
        
        <div class="content">
            <div id="checkout-form">
                <div class="order-summary">
                    <div class="order-info">
                        <h3>Produto Digital</h3>
                        <p>Valor: R$ 20,00</p>
                    </div>
                </div>

                <div class="form-group">
                    <label>NOME COMPLETO</label>
                    <input type="text" id="name" placeholder="Ex: João Silva" required>
                </div>
                <div class="form-group">
                    <label>E-MAIL</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>
                </div>

                <button class="btn-pay" id="btn-pay">GERAR PIX</button>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Gerando seu PIX...</p>
                </div>
            </div>

            <div id="pix-section">
                <div class="pix-box">
                    <img id="qr-code-img" class="qr-code-img" src="" alt="QR Code PIX">
                    <div class="pix-code" id="pix-code-text"></div>
                    <button class="btn-copy" onclick="copyPix()">COPIAR CÓDIGO PIX</button>
                </div>
                <p style="margin-top: 20px; font-size: 0.8rem; color: var(--text-gray);">
                    <i class="fa-solid fa-shield-halved"></i> Pagamento Seguro
                </p>
            </div>
        </div>
    </div>

    <script>
        const btnPay = document.getElementById('btn-pay');
        const checkoutForm = document.getElementById('checkout-form');
        const pixSection = document.getElementById('pix-section');
        const loading = document.getElementById('loading');
        const pixCodeDisplay = document.getElementById('pix-code-text');
        const qrImg = document.getElementById('qr-code-img');

        btnPay.addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const cpf = document.getElementById('cpf').value;

            if (!name || !email || !cpf) {
                alert('Preencha todos os campos.');
                return;
            }

            btnPay.style.display = 'none';
            loading.style.display = 'flex';

            try {
                const response = await fetch('/api/generate-pix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, cpf })
                });

                const data = await response.json();

                if (data.pix_code) {
                    pixCodeDisplay.innerText = data.pix_code;
                    qrImg.src = data.qr_code_base64 || '';
                    checkoutForm.style.display = 'none';
                    pixSection.style.display = 'block';
                } else {
                    throw new Error(data.error || 'Erro ao gerar PIX');
                }
            } catch (error) {
                alert('Erro: ' + error.message);
                btnPay.style.display = 'block';
                loading.style.display = 'none';
            }
        });

        function copyPix() {
            const code = pixCodeDisplay.innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert('Código PIX copiado!');
            });
        }
    </script>
</body>
</html>
