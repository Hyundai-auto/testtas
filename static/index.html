<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Seguro | Pagamento via Pix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #0055ff;
            --primary-dark: #0033cc;
            --bg-light: #f5f7fa;
            --text-dark: #1a1a1a;
            --success: #28a745;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: var(--bg-light); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .content { padding: 25px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; color: #555; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1rem; outline: none; }
        .form-group input:focus { border-color: var(--primary); }

        .btn-pay { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-pay:disabled { background: #ccc; cursor: not-allowed; }

        /* Tela de Pix Gerado */
        #pix-display { display: none; text-align: center; animation: fadeIn 0.5s; }
        .pix-box { background: #f0f7ff; border: 2px dashed var(--primary); border-radius: 15px; padding: 20px; margin-top: 20px; }
        .pix-code { word-break: break-all; font-family: monospace; font-size: 0.85rem; background: white; padding: 10px; border-radius: 8px; margin: 15px 0; border: 1px solid #ddd; max-height: 100px; overflow-y: auto; }
        .btn-copy { background: var(--success); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }

        /* Loading */
        .loading { display: none; text-align: center; padding: 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Checkout Seguro</h2>
            <p>Finalize seu pedido via PIX</p>
        </div>

        <div class="content" id="main-content">
            <div id="checkout-form">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="name" placeholder="Ex: Ana Beatriz Mendes">
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="tel" id="cpf" placeholder="000.000.000-00">
                </div>
                <div class="form-group">
                    <label>WhatsApp</label>
                    <input type="tel" id="phone" placeholder="(00) 00000-0000">
                </div>
                <button class="btn-pay" id="btn-pay">GERAR PIX AGORA</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Gerando seu PIX com segurança...</p>
                <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">Aguarde, não feche esta página.</p>
            </div>

            <div id="pix-display">
                <div style="color: var(--success); font-size: 3rem; margin-bottom: 10px;"><i class="fas fa-check-circle"></i></div>
                <h3>Pix Gerado com Sucesso!</h3>
                <p>Copie o código abaixo e pague no seu banco.</p>
                
                <div class="pix-box">
                    <div class="pix-code" id="pix-code-text">000201...</div>
                    <button class="btn-copy" id="btn-copy">COPIAR CÓDIGO PIX</button>
                </div>
                
                <p style="margin-top: 20px; font-size: 0.85rem; color: #666;">
                    <i class="fas fa-info-circle"></i> A liberação do seu pedido é automática após o pagamento.
                </p>
            </div>
        </div>
    </div>

    <script>
        const btnPay = document.getElementById('btn-pay');
        const checkoutForm = document.getElementById('checkout-form');
        const loading = document.getElementById('loading');
        const pixDisplay = document.getElementById('pix-display');
        const pixCodeText = document.getElementById('pix-code-text');

        btnPay.addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            const cpf = document.getElementById('cpf').value;
            const phone = document.getElementById('phone').value;

            if(!name || !cpf || !phone) {
                alert('Por favor, preencha todos os campos.');
                return;
            }

            checkoutForm.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch('/proxy/pix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ payer_name: name, payer_cpf: cpf, payer_phone: phone })
                });

                const data = await response.json();

                if(data.success && data.pixCode) {
                    loading.style.display = 'none';
                    pixDisplay.style.display = 'block';
                    pixCodeText.innerText = data.pixCode;
                } else {
                    throw new Error(data.error || 'Erro ao gerar PIX');
                }
            } catch (err) {
                alert(err.message);
                checkoutForm.style.display = 'block';
                loading.style.display = 'none';
            }
        });

        document.getElementById('btn-copy').addEventListener('click', () => {
            const code = pixCodeText.innerText;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.getElementById('btn-copy');
                const originalText = btn.innerText;
                btn.innerText = 'CÓDIGO COPIADO!';
                btn.style.background = '#1a1a1a';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = 'var(--success)';
                }, 2000);
            });
        });
    </script>
</body>
</html>
